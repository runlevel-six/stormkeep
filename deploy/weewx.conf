# weewx configuration for a WeatherFlow Tempest station, as run by the
# weewx container in this repository.
#
# Every REPLACE value is station-specific. Copy this file into your overlay
# and fill them in there; see docs/how-to/deploy.md. The rest describes how
# the container is laid out and is not meant to change.

# Where the image keeps weewx's own files. The driver lives in bin/user.
WEEWX_ROOT = /opt/weewx
USER_ROOT = bin/user

debug = 0
log_success = True
log_failure = True
# A driver that cannot open its socket keeps retrying instead of exiting.
loop_on_init = True

[Station]
    location = "REPLACE: a place name, shown to CWOP and in logs"
    # Decimal degrees, south and west negative. Used for the solar
    # calculations (maximum solar radiation, evapotranspiration).
    latitude = 0.0
    longitude = 0.0
    # The station's height above sea level: this is what turns its station
    # pressure into the sea-level pressure weewx calculates.
    altitude = 0, meter
    station_type = WeatherFlowUDP
    rain_year_start = 1
    week_start = 6

[WeatherFlowUDP]
    driver = user.weatherflowudp
    log_raw_packets = False
    udp_address = 0.0.0.0
    udp_port = 50222
    udp_timeout = 90
    # Opens the port with SO_REUSEADDR, so the dashboard can listen to the
    # same broadcasts. Both listeners must set it.
    share_socket = True

    # Replace ST-00000000 with your sensor's serial number (on the sensor's
    # label, or in any obs_st broadcast). weewx field = observation.serial.type
    [[sensor_map]]
        outTemp = air_temperature.ST-00000000.obs_st
        outHumidity = relative_humidity.ST-00000000.obs_st
        pressure = station_pressure.ST-00000000.obs_st
        windSpeed = wind_avg.ST-00000000.obs_st
        windGust = wind_gust.ST-00000000.obs_st
        windDir = wind_direction.ST-00000000.obs_st
        rain = rain_accumulated.ST-00000000.obs_st
        UV = uv.ST-00000000.obs_st
        radiation = solar_radiation.ST-00000000.obs_st
        luminosity = illuminance.ST-00000000.obs_st
        lightning_strike_count = lightning_strike_count.ST-00000000.obs_st
        lightning_distance = lightning_strike_avg_distance.ST-00000000.obs_st
        outTempBatteryStatus = battery.ST-00000000.obs_st

[StdRESTful]
    # The Citizen Weather Observer Program. Leave it off until this is the
    # only weewx running for the station, or every report is sent twice.
    [[CWOP]]
        enable = false
        station = REPLACE
        post_interval = 300
    [[StationRegistry]]
        register_this_station = false

# weewx converts every reading to this unit system before storing it, and
# refuses to open a database written in another one. METRICWX is °C, m/s,
# mbar and mm, the units the station itself reports. If you bring an existing
# database, set this to the system it was written in (its usUnits column:
# 1 US, 16 METRIC, 17 METRICWX).
[StdConvert]
    target_unit = METRICWX

[StdCalibrate]
    [[Corrections]]

# Readings outside these bounds are discarded as sensor errors.
[StdQC]
    [[MinMax]]
        outTemp = -40, 60, degree_C
        outHumidity = 0, 100
        pressure = 800, 1100, mbar
        windSpeed = 0, 60, meter_per_second
        windGust = 0, 80, meter_per_second
        rain = 0, 50, mm

# Without this section weewx 5 calculates none of these, and stores NULL.
# CWOP needs barometer; rainRate and dewpoint are used by most reports.
[StdWXCalculate]
    [[Calculations]]
        pressure = prefer_hardware
        altimeter = prefer_hardware
        appTemp = prefer_hardware
        barometer = prefer_hardware
        cloudbase = prefer_hardware
        dewpoint = prefer_hardware
        ET = prefer_hardware
        heatindex = prefer_hardware
        humidex = prefer_hardware
        inDewpoint = prefer_hardware
        maxSolarRad = prefer_hardware
        rainRate = prefer_hardware
        windchill = prefer_hardware
        windrun = prefer_hardware

[StdArchive]
    archive_interval = 300
    record_generation = software
    loop_hilo = True
    data_binding = wx_binding

[DataBindings]
    [[wx_binding]]
        database = archive_sqlite
        table_name = archive
        manager = weewx.manager.DaySummaryManager
        schema = schemas.wview_extended.schema

[Databases]
    [[archive_sqlite]]
        database_name = weewx.sdb
        database_type = SQLite

[DatabaseTypes]
    [[SQLite]]
        driver = weedb.sqlite
        # The persistent volume.
        SQLITE_ROOT = /data

[Engine]
    [[Services]]
        prep_services = ,
        data_services = ,
        process_services = weewx.engine.StdConvert, weewx.engine.StdCalibrate, weewx.engine.StdQC, weewx.wxservices.StdWXCalculate
        xtype_services = weewx.wxxtypes.StdWXXTypes, weewx.wxxtypes.StdPressureCooker, weewx.wxxtypes.StdRainRater, weewx.wxxtypes.StdDelta
        archive_services = weewx.engine.StdArchive
        restful_services = weewx.restx.StdCWOP
        # No reports: the dashboard reads the database directly.
        report_services = ,

# Log to standard output, where the container runtime collects it. weewx's
# default is syslog, which a container does not have.
[Logging]
    [[root]]
        level = INFO
        handlers = console,
    [[handlers]]
        [[[console]]]
            level = DEBUG
            formatter = standard
            class = logging.StreamHandler
            stream = ext://sys.stdout
    [[formatters]]
        [[[standard]]]
            format = "%(levelname)s %(name)s: %(message)s"
